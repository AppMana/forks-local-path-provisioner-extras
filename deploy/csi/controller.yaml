apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-csi-controller
  namespace: local-path-storage
  labels:
    app: local-path-csi-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-path-csi-controller
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: local-path-csi-controller
    spec:
      serviceAccountName: local-path-csi-controller
      priorityClassName: system-cluster-critical
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.1.0
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election=true
            - --extra-create-metadata=true
            - --feature-gates=Topology=true
            - --enable-capacity=true
            - --capacity-ownerref-level=2
            - --capacity-poll-interval=30s
            - --strict-topology=true
            - --immediate-topology=false
            - --v=2
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v1.13.0
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election=true
            - --v=2
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-snapshotter
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.2.0
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election=true
            - --v=2
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: local-path-csi
          image: ghcr.io/appmana/local-path-csi:latest
          imagePullPolicy: IfNotPresent
          args:
            - --mode=controller
            - --csi-endpoint=unix:///csi/csi.sock
            - --namespace=$(POD_NAMESPACE)
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HELPER_IMAGE
              value: ghcr.io/appmana/local-path-helper:latest
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          emptyDir: {}
