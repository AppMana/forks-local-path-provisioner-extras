---
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage
---
# Controller pod's identity. csi-provisioner / csi-resizer / csi-snapshotter
# sidecars and our binary all run under this SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-csi-controller
  namespace: local-path-storage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-csi-node
  namespace: local-path-storage
---
# ServiceAccount used by helper pods spawned by the controller. Distinct from
# the controller's own SA so we can grant the helper minimal privileges (none
# beyond what the helper pod's hostPath mounts give).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-service-account
  namespace: local-path-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-csi-controller
rules:
  # Our binary: list PVs (capacity tracker rebuild + DeleteVolume PV lookup),
  # create/get/delete helper pods, get nodes, get configmaps, get pods/log.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]

  # csi-provisioner sidecar
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["create", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csistoragecapacities"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # csi-resizer sidecar
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch"]

  # csi-snapshotter sidecar
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["create", "get", "list", "watch", "update", "delete", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots/status"]
    verbs: ["update", "patch"]

  # Leader election for the sidecars.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "create", "update", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-csi-controller
subjects:
  - kind: ServiceAccount
    name: local-path-csi-controller
    namespace: local-path-storage
roleRef:
  kind: ClusterRole
  name: local-path-csi-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-csi-node
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  # Node-side capacity reporter writes free-bytes-by-path annotations.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
  # Node-side reporter reads the configmap to know which paths to statfs.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-csi-node
subjects:
  - kind: ServiceAccount
    name: local-path-csi-node
    namespace: local-path-storage
roleRef:
  kind: ClusterRole
  name: local-path-csi-node
  apiGroup: rbac.authorization.k8s.io
