apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  # config.json drives node→path mapping, optional per-path capacity budgets,
  # min/max PVC size, and the helper-pod command paths. The setup/teardown/
  # resize commands point at the scripts baked into the helper image
  # (package/helper-image/scripts), so they are not duplicated as ConfigMap
  # script blobs. Override these to swap in custom scripts.
  config.json: |
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/opt/local-path-provisioner"]
        }
      ],
      "setupCommand": "/usr/local/sbin/setup.sh",
      "teardownCommand": "/usr/local/sbin/teardown.sh",
      "resizeCommand": "/usr/local/sbin/resize.sh",
      "snapshotCommand": "/usr/local/sbin/snapshot.sh",
      "restoreCommand": "/usr/local/sbin/restore.sh"
    }
  # Linux helper-pod template. Scheduled on the target Linux node by the
  # controller. Privileged because the xfs/ext4 project-quota branches
  # write to /etc/projects + /etc/projid and call xfs_quota / setquota /
  # chattr +P.
  helperPod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: helper-pod
          image: ghcr.io/appmana/local-path-helper:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          volumeMounts:
            - name: quota-projects
              mountPath: /etc/projects
            - name: quota-projid
              mountPath: /etc/projid
            - name: device-dir
              mountPath: /dev
            - name: lock-dir
              mountPath: /run/local-path-csi
      volumes:
        - name: quota-projects
          hostPath:
            path: /etc/projects
            type: FileOrCreate
        - name: quota-projid
          hostPath:
            path: /etc/projid
            type: FileOrCreate
        - name: device-dir
          hostPath:
            path: /dev
        - name: lock-dir
          hostPath:
            path: /run/local-path-csi
            type: DirectoryOrCreate
  # Windows helper-pod template. HostProcess container (k8s >= 1.23) — runs
  # as the host's NT AUTHORITY\SYSTEM with direct access to the node
  # filesystem, so no hostPath mounts are needed and FSRM cmdlets work
  # against on-disk dirs natively. The image must include the
  # FS-Resource-Manager Windows feature (servercore base, not nanoserver).
  helperPod-windows.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      securityContext:
        windowsOptions:
          hostProcess: true
          runAsUserName: "NT AUTHORITY\\SYSTEM"
      hostNetwork: true
      nodeSelector:
        kubernetes.io/os: windows
      tolerations:
        - operator: Exists
      containers:
        - name: helper-pod
          image: ghcr.io/appmana/local-path-helper:latest
          imagePullPolicy: IfNotPresent
