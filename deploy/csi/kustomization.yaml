apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - configmap.yaml
  - csidriver.yaml
  - controller.yaml
  - node.yaml
  - storageclass.yaml
  # Requires the external-snapshotter CRDs + snapshot-controller installed
  # cluster-wide (see volumesnapshotclass.yaml). The controller Deployment's
  # csi-snapshotter sidecar also needs them.
  - volumesnapshotclass.yaml
