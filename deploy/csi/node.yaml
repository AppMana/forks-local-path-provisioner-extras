apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: local-path-csi-node
  namespace: local-path-storage
  labels:
    app: local-path-csi-node
spec:
  selector:
    matchLabels:
      app: local-path-csi-node
  template:
    metadata:
      labels:
        app: local-path-csi-node
    spec:
      serviceAccountName: local-path-csi-node
      priorityClassName: system-node-critical
      hostNetwork: true
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      containers:
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/local-path.appmana.io/csi.sock
            - --v=2
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: local-path-csi
          image: ghcr.io/appmana/local-path-csi:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          args:
            - --mode=node
            - --csi-endpoint=unix:///csi/csi.sock
            - --namespace=$(POD_NAMESPACE)
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
      volumes:
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/local-path.appmana.io
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: pods-mount-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
