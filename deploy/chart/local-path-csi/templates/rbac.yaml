---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "local-path-csi.controllerName" . }}
  namespace: {{ include "local-path-csi.namespace" . }}
  labels:
    {{- include "local-path-csi.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "local-path-csi.nodeName" . }}
  namespace: {{ include "local-path-csi.namespace" . }}
  labels:
    {{- include "local-path-csi.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "local-path-csi.helperSAName" . }}
  namespace: {{ include "local-path-csi.namespace" . }}
  labels:
    {{- include "local-path-csi.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "local-path-csi.controllerName" . }}
  labels:
    {{- include "local-path-csi.labels" . | nindent 4 }}
rules:
  # Driver: capacity tracker rebuild + DeleteVolume PV lookup.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "patch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  # csi-provisioner
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csistoragecapacities"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # csi-provisioner --capacity-ownerref-level=2 walks pod -> replicaset ->
  # deployment to compute the CSIStorageCapacity owner reference. Without
  # GET on these the controller pod crash-loops with "look up owner(s) of
  # pod ... is forbidden".
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get"]
  # csi-snapshotter
  {{- if .Values.snapshots.enabled }}
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["create", "get", "list", "watch", "update", "delete", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots/status"]
    verbs: ["update", "patch"]
  {{- end }}
  # Leader election across sidecars.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "create", "update", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "local-path-csi.controllerName" . }}
  labels:
    {{- include "local-path-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "local-path-csi.controllerName" . }}
    namespace: {{ include "local-path-csi.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "local-path-csi.controllerName" . }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "local-path-csi.nodeName" . }}
  labels:
    {{- include "local-path-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "local-path-csi.nodeName" . }}
  labels:
    {{- include "local-path-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "local-path-csi.nodeName" . }}
    namespace: {{ include "local-path-csi.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "local-path-csi.nodeName" . }}
  apiGroup: rbac.authorization.k8s.io
