name: driver-image

on:
  push:
    branches: [appmana-extras, master, main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - 'Dockerfile.runtime'
      - 'Dockerfile.windows'
      - '.github/workflows/driver-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/local-path-csi

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.sha }}
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:linux-${{ github.sha }}

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: cross-compile windows/amd64
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -mod=vendor -trimpath -ldflags="-s -w -X main.VERSION=${{ github.sha }}" -o local-path-csi.exe .
      - name: login
        shell: pwsh
        run: docker login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
      - name: build & push
        shell: pwsh
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:windows-${{ github.sha }} `
            -f Dockerfile.windows --build-arg WINRELEASE=ltsc2022 .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:windows-${{ github.sha }}

  manifest:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: imjasonh/setup-crane@v0.4
      - run: |
          crane auth login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          crane index append \
            -m ${{ env.REGISTRY }}/${{ env.IMAGE }}:linux-${{ github.sha }} \
            -m ${{ env.REGISTRY }}/${{ env.IMAGE }}:windows-${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          echo "Pushed ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }} (+ :latest)"
