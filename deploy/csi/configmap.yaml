apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  # config.json drives node→path mapping, optional per-path capacity budgets,
  # min/max PVC size, and the helper-pod command paths. The setup/teardown/
  # resize commands point at the scripts baked into the helper image
  # (package/helper-image/scripts), so they are not duplicated as ConfigMap
  # script blobs. Override these to swap in custom scripts.
  config.json: |
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/opt/local-path-provisioner"]
        }
      ],
      "setupCommand": "/opt/local-path-provisioner/setup.sh",
      "teardownCommand": "/opt/local-path-provisioner/teardown.sh",
      "resizeCommand": "/opt/local-path-provisioner/resize.sh",
      "snapshotCommand": "/opt/local-path-provisioner/snapshot.sh",
      "restoreCommand": "/opt/local-path-provisioner/restore.sh"
    }
  helperPod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: helper-pod
          image: ghcr.io/appmana/local-path-helper:latest
          imagePullPolicy: IfNotPresent
          # Required for the xfs/ext4 project-quota branches: writable
          # /etc/projects + /etc/projid, /dev (xfs_quota), /var/lock (flock).
          securityContext:
            privileged: true
          volumeMounts:
            - name: quota-projects
              mountPath: /etc/projects
            - name: quota-projid
              mountPath: /etc/projid
            - name: device-dir
              mountPath: /dev
            - name: lock-dir
              mountPath: /var/lock
      volumes:
        - name: quota-projects
          hostPath:
            path: /etc/projects
            type: FileOrCreate
        - name: quota-projid
          hostPath:
            path: /etc/projid
            type: FileOrCreate
        - name: device-dir
          hostPath:
            path: /dev
        - name: lock-dir
          hostPath:
            path: /var/lock
            type: DirectoryOrCreate
