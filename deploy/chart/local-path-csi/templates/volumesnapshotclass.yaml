{{- if .Values.snapshots.enabled }}
{{- /*
The external-snapshotter CRDs must be installed cluster-wide before this
manifest applies. When the chart is rendered against a live cluster
(helm install / upgrade), use `lookup` to confirm. During plain
`helm template` (lookup returns empty), skip the check so CI/dry-run
flows still produce parseable YAML.
*/ -}}
{{- $crds := (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "") -}}
{{- if and $crds $crds.items -}}
{{-   $haveSnapshotCRDs := false -}}
{{-   range $crd := $crds.items -}}
{{-     if eq $crd.metadata.name "volumesnapshotclasses.snapshot.storage.k8s.io" -}}
{{-       $haveSnapshotCRDs = true -}}
{{-     end -}}
{{-   end -}}
{{-   if not $haveSnapshotCRDs -}}
{{-     fail "snapshots.enabled=true but the external-snapshotter CRDs (volumesnapshotclasses.snapshot.storage.k8s.io) are not installed in the cluster. Install them from https://github.com/kubernetes-csi/external-snapshotter or set snapshots.enabled=false." -}}
{{-   end -}}
{{- end -}}
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: {{ .Values.snapshots.volumeSnapshotClassName | quote }}
  labels:
    {{- include "local-path-csi.labels" . | nindent 4 }}
driver: {{ .Values.driverName | quote }}
deletionPolicy: {{ .Values.snapshots.deletionPolicy }}
{{- end }}
