apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: {{ include "local-path-csi.namespace" . }}
  labels:
    {{- include "local-path-csi.labels" . | nindent 4 }}
data:
  config.json: |
{{ .Values.config | toJson | nindent 4 }}
  helperPod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: helper-pod
          image: {{ include "local-path-csi.helperImage" . }}
          imagePullPolicy: {{ .Values.helperImage.pullPolicy }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: quota-projects
              mountPath: /etc/projects
            - name: quota-projid
              mountPath: /etc/projid
            - name: device-dir
              mountPath: /dev
            - name: lock-dir
              mountPath: /run/local-path-csi
      volumes:
        - name: quota-projects
          hostPath: { path: /etc/projects, type: FileOrCreate }
        - name: quota-projid
          hostPath: { path: /etc/projid, type: FileOrCreate }
        - name: device-dir
          hostPath: { path: /dev }
        - name: lock-dir
          hostPath: { path: /run/local-path-csi, type: DirectoryOrCreate }
  {{- if .Values.windows.enabled }}
  # Windows helper-pod template. HostProcess (kubelet >= 1.23), runs as
  # NT AUTHORITY\SYSTEM. The helper image must include the FS-Resource-Manager
  # Windows feature (servercore base, not nanoserver) — see windows.Dockerfile.
  helperPod-windows.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      securityContext:
        windowsOptions:
          hostProcess: true
          runAsUserName: "NT AUTHORITY\\SYSTEM"
      hostNetwork: true
      nodeSelector:
        kubernetes.io/os: windows
      tolerations:
        - operator: Exists
      containers:
        - name: helper-pod
          image: {{ include "local-path-csi.helperImage" . }}
          imagePullPolicy: {{ .Values.helperImage.pullPolicy }}
  {{- end }}
